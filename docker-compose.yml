services:
  seating:
    build: .
    container_name: seating
    restart: unless-stopped
    ports:
      # 3005 (rsvp-app) und 3006 (abstimmungstool) sind auf diesem Server belegt - bei Bedarf anpassen.
      - "3007:3000"
    volumes:
      # SQLite-Datenbank außerhalb des Containers, damit Buchungen Updates überleben.
      # Der Container läuft als Nutzer "node" (UID 1000) - das Verzeichnis muss ihm gehören,
      # siehe README "Deployment".
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/app/data/prod.db
      - TZ=Europe/Berlin
